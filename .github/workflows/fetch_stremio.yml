name: Sync Stremio IPA

on:
  schedule:
    - cron: '0 0 * * *' # Controlla ogni giorno a mezzanotte
  workflow_dispatch: # Permette l'avvio manuale dalla scheda Actions

jobs:
  download-and-release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Extract IPA URL and Version from Source JSON
        id: get_stremio
        run: |
          # Scarica il source.json di Stremio
          curl -s https://dl.strem.io/apple/altstore/source.json -o source.json

          # Estrae URL e Versione tramite jq
          IPA_URL=$(jq -r '.apps[0].versions[0].downloadURL' source.json)
          VERSION=$(jq -r '.apps[0].versions[0].version' source.json)

          echo "ipa_url=$IPA_URL" >> $GITHUB_OUTPUT
          echo "version=$VERSION" >> $GITHUB_OUTPUT

          # Scarica il file IPA
          curl -L -o Stremio.ipa "$IPA_URL"

      - name: Create GitHub Release and Upload IPA
        uses: softprops/action-gh-release@v1
        with:
          tag_name: "v${{ steps.get_stremio.outputs.version }}"
          name: "Stremio v${{ steps.get_stremio.outputs.version }}"
          body: "Automatic download of official Stremio IPA from AltStore PAL source."
          files: Stremio.ipa
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
