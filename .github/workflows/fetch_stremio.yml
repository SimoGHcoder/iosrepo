name: Sync Stremio IPA

on:
  schedule:
    - cron: '0 0 * * *' # Esegue la verifica ogni giorno a mezzanotte
  workflow_dispatch: # Permette l'avvio manuale dalla scheda Actions di GitHub

jobs:
  sync-stremio-release:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Download Official Stremio IPA
        id: download_stremio
        run: |
          # 1. Scarica il manifesto principale di AltStore
          curl -sSL -A "Mozilla/5.0 (iPhone; CPU iPhone OS 17_0 like Mac OS X)" \
               https://dl.strem.io/apple/altstore/source.json -o source.json

          # 2. Estrae la versione e l'URL del manifesto secondario
          MANIFEST_URL=$(jq -r '.apps[0].versions[0].downloadURL' source.json)
          VERSION=$(jq -r '.apps[0].versions[0].version' source.json)

          echo "VERSION=$VERSION" >> $GITHUB_ENV
          echo "Rilevata versione: $VERSION"
          echo "URL Manifesto: $MANIFEST_URL"

          # 3. Scarica il manifesto della versione
          curl -sSLf -A "Mozilla/5.0 (iPhone; CPU iPhone OS 17_0 like Mac OS X)" \
               "$MANIFEST_URL" -o manifest.json || true

          # 4. Estrazione percorso
          RAW_PATH=$(jq -r '.. | strings | select(endswith(".ipa"))' manifest.json 2>/dev/null | { head -n 1; cat >/dev/null; })

          if [[ "$RAW_PATH" == http* ]]; then
            IPA_URL="$RAW_PATH"
          elif [[ "$RAW_PATH" == /* ]]; then
            IPA_URL="https://dl.strem.io$RAW_PATH"
          elif [ -n "$RAW_PATH" ]; then
            IPA_URL="https://dl.strem.io/$RAW_PATH"
          fi

          echo "Tentativo 1 - URL PAL: $IPA_URL"

          # 5. Tenta il download dall'endpoint AltStore
          if [ -n "$IPA_URL" ]; then
            curl -sSL -A "Mozilla/5.0 (iPhone; CPU iPhone OS 17_0 like Mac OS X)" \
                 -o Stremio.ipa "$IPA_URL"
          fi

          FILESIZE=$(stat -c%s "Stremio.ipa" 2>/dev/null || echo 0)
          echo "Dimensione tentata da PAL: $FILESIZE byte"

          # 6. FALLBACK: Se PAL restituisce un finto file (< 10 MB), scarica la Release ufficiale da GitHub
          if [ $FILESIZE -lt 10485760 ]; then
            echo "Endpoint PAL protetto da token/CDN. Avvio fallback su Release GitHub ufficiali di Stremio..."
            
            GH_IPA_URL=$(curl -s https://api.github.com/repos/Stremio/stremio-shell/releases | jq -r '.[].assets[] | select(.name | endswith(".ipa")) | .browser_download_url' | head -n 1)

            if [ -z "$GH_IPA_URL" ] || [ "$GH_IPA_URL" == "null" ]; then
              # Secondo fallback se la repo principale è differente
              GH_IPA_URL="https://dl.strem.io/apple/v${VERSION}/Stremio.ipa"
            fi

            echo "URL Fallback: $GH_IPA_URL"
            curl -sSL -A "Mozilla/5.0 (iPhone; CPU iPhone OS 17_0 like Mac OS X)" \
                 -o Stremio.ipa "$GH_IPA_URL"
          fi

          # 7. Verifica finale dimensione file (> 10 MB)
          FINAL_SIZE=$(stat -c%s "Stremio.ipa" 2>/dev/null || echo 0)
          echo "Dimensione file finale scaricato: $FINAL_SIZE byte"

          if [ $FINAL_SIZE -lt 10485760 ]; then
            echo "::error:: Impossibile recuperare un IPA valido. Dimensione ottenuta: $FINAL_SIZE byte."
            cat Stremio.ipa
            exit 1
          fi

      - name: Check if Release Already Exists
        id: check_release
        run: |
          if gh release view "v${{ env.VERSION }}" >/dev/null 2>&1; then
            echo "exists=true" >> $GITHUB_OUTPUT
            echo "La release v${{ env.VERSION }} esiste già. Salto la creazione."
          else
            echo "exists=false" >> $GITHUB_OUTPUT
          fi
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Create GitHub Release
        if: steps.check_release.outputs.exists == 'false'
        uses: softprops/action-gh-release@v1
        with:
          tag_name: "v${{ env.VERSION }}"
          name: "Stremio v${{ env.VERSION }}"
          body: |
            Download automatico dell'IPA ufficiale di Stremio (Versione ${{ env.VERSION }}).
            
            - **Versione:** ${{ env.VERSION }}
            - **Sorgente:** Stremio Official Releases
          files: Stremio.ipa
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
