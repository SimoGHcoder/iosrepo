name: Sync Stremio IPA

on:
  schedule:
    - cron: '0 0 * * *' # Esegue la verifica ogni giorno a mezzanotte
  workflow_dispatch: # Permette l'avvio manuale dalla scheda Actions di GitHub

jobs:
  sync-stremio-release:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Download Official Stremio IPA
        id: download_stremio
        run: |
          # 1. Scarica il manifesto principale di AltStore
          curl -sSL -A "Mozilla/5.0 (iPhone; CPU iPhone OS 17_0 like Mac OS X)" \
               https://dl.strem.io/apple/altstore/source.json -o source.json

          # 2. Estrae l'URL del manifesto per ricavare la versione completa di build (es. 2.0.8-23)
          MANIFEST_URL=$(jq -r '.apps[0].versions[0].downloadURL' source.json)
          BASE_VERSION=$(jq -r '.apps[0].versions[0].version' source.json)

          # Ricava la stringa di build dal percorso (trasforma '2.0.8-23' in '2.0.8b23')
          BUILD_TAG=$(echo "$MANIFEST_URL" | grep -oE '[0-9]+\.[0-9]+\.[0-9]+-[0-9]+' | sed 's/-/'b'/')

          # Se la regex non trova il pattern con il trattino, usa la versione base
          if [ -z "$BUILD_TAG" ]; then
            BUILD_TAG="$BASE_VERSION"
          fi

          echo "VERSION=$BASE_VERSION" >> $GITHUB_ENV
          echo "BUILD_TAG=$BUILD_TAG" >> $GITHUB_ENV
          echo "Rilevata versione base: $BASE_VERSION"
          echo "Tag build ricavato per CDN: $BUILD_TAG"

          # 3. Costruisce l'URL statico dinamico
          DIRECT_IPA_URL="https://dl.strem.io/apple/${BUILD_TAG}/ios/stremio_iOS.ipa"
          echo "URL IPA generato: $DIRECT_IPA_URL"

          # 4. Scarica il file .ipa reale
          curl -sSL -A "Mozilla/5.0 (iPhone; CPU iPhone OS 17_0 like Mac OS X)" \
               -o Stremio.ipa "$DIRECT_IPA_URL"

          # 5. Verifica che il file sia un IPA valido (> 10 MB)
          FILESIZE=$(stat -c%s "Stremio.ipa" 2>/dev/null || echo 0)
          echo "Dimensione file scaricato: $FILESIZE byte"

          if [ $FILESIZE -lt 10485760 ]; then
            echo "::error:: Il file scaricato non è un IPA valido ($FILESIZE byte)."
            cat Stremio.ipa | head -n 20
            exit 1
          fi

      - name: Create or Update GitHub Release
        uses: softprops/action-gh-release@v1
        with:
          tag_name: "Stremio"
          name: "Stremio"
          body: |
            Download automatico dell'IPA ufficiale di Stremio estratto dalla CDN diretta.
            
            - **Ultima Versione Sincronizzata:** ${{ env.VERSION }} (${{ env.BUILD_TAG }})
            - **Sorgente:** [Stremio CDN Direct](https://dl.strem.io/apple/${{ env.BUILD_TAG }}/ios/stremio_iOS.ipa)
          files: Stremio.ipa
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
