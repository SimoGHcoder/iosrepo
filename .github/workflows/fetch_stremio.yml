name: Sync Stremio IPA

on:
  schedule:
    # Esegue il controllo automatico ogni giorno a mezzanotte
    - cron: '0 0 * * *'
  workflow_dispatch: # Permette l'avvio manuale dalla scheda Actions di GitHub

permissions:
  contents: write

jobs:
  sync-stremio-release:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Check and Download Official Stremio IPA
        id: download_stremio
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          MY_REPO: ${{ github.repository }}
        run: |
          set -e

          # 1. Scarica il manifesto principale di AltStore
          echo "Recupero manifesto Stremio AltStore..."
          curl -sSL -A "Mozilla/5.0 (iPhone; CPU iPhone OS 17_0 like Mac OS X)" \
               https://dl.strem.io/apple/altstore/source.json -o source.json

          # 2. Estrae la versione e l'URL
          MANIFEST_URL=$(jq -r '.apps[0].versions[0].downloadURL // empty' source.json)
          BASE_VERSION=$(jq -r '.apps[0].versions[0].version // empty' source.json)

          if [ -z "$BASE_VERSION" ] || [ -z "$MANIFEST_URL" ]; then
            echo "::error:: Impossibile leggere i dati dal manifesto di Stremio."
            exit 1
          fi

          # Ricava la stringa di build dal percorso (trasforma '2.0.8-23' in '2.0.8b23')
          BUILD_TAG=$(echo "$MANIFEST_URL" | grep -oE '[0-9]+\.[0-9]+\.[0-9]+-[0-9]+' | sed 's/-/'b'/')

          if [ -z "$BUILD_TAG" ]; then
            BUILD_TAG="$BASE_VERSION"
          fi

          echo "VERSION=$BASE_VERSION" >> $GITHUB_ENV
          echo "BUILD_TAG=$BUILD_TAG" >> $GITHUB_ENV
          echo "Rilevata versione ufficiale: $BASE_VERSION ($BUILD_TAG)"

          # 3. Controlla se la release attuale ha già questa versione
          CURRENT_RELEASE_BODY=$(curl -sSL -H "Authorization: token $GITHUB_TOKEN" \
            "https://api.github.com/repos/$MY_REPO/releases/tags/Stremio" | jq -r '.body // empty')

          if echo "$CURRENT_RELEASE_BODY" | grep -q "$BUILD_TAG"; then
            echo "La tua release contiene già la versione $BUILD_TAG. Nessun aggiornamento necessario."
            echo "SHOULD_UPDATE=false" >> $GITHUB_ENV
            exit 0
          fi

          echo "Nuova versione rilevata ($BUILD_TAG)! Procedo al download..."
          echo "SHOULD_UPDATE=true" >> $GITHUB_ENV

          # 4. Costruisce l'URL statico dinamico e scarica l'IPA
          DIRECT_IPA_URL="https://dl.strem.io/apple/${BUILD_TAG}/ios/stremio_iOS.ipa"
          echo "URL IPA generato: $DIRECT_IPA_URL"

          curl -sSL --fail -A "Mozilla/5.0 (iPhone; CPU iPhone OS 17_0 like Mac OS X)" \
               -o Stremio.ipa "$DIRECT_IPA_URL"

          # 5. Verifica che il file sia un IPA valido (> 10 MB)
          FILESIZE=$(stat -c%s "Stremio.ipa" 2>/dev/null || echo 0)
          echo "Dimensione file scaricato: $FILESIZE byte"

          if [ $FILESIZE -lt 10485760 ]; then
            echo "::error:: Il file scaricato non è un IPA valido ($FILESIZE byte)."
            exit 1
          fi

      - name: Create or Update GitHub Release
        if: env.SHOULD_UPDATE == 'true'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: "Stremio"
          name: "Stremio ${{ env.BUILD_TAG }}"
          body: |
            Download automatico dell'IPA ufficiale di Stremio estratto dalla CDN diretta.
            
            - **Ultima Versione Sincronizzata:** ${{ env.VERSION }} (${{ env.BUILD_TAG }})
            - **Sorgente:** [Stremio CDN Direct](https://dl.strem.io/apple/${{ env.BUILD_TAG }}/ios/stremio_iOS.ipa)
          files: Stremio.ipa
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # 6. Scatena l'estrazione delle icone e la rigenerazione automatica di apps.json
      - name: Trigger Full Auto-Extract Workflow
        if: env.SHOULD_UPDATE == 'true' && success()
        uses: peter-evans/repository-dispatch@v3
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          event-type: ipa_updated
