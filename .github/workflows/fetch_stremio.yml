name: Sync Stremio IPA

on:
  schedule:
    - cron: '0 0 * * *' # Esegue la verifica ogni giorno a mezzanotte
  workflow_dispatch: # Permette l'avvio manuale dalla scheda Actions di GitHub

jobs:
  sync-stremio-release:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Download Official Stremio IPA
        id: download_stremio
        run: |
          # 1. Recupera la versione dal manifesto principale
          curl -sSL -A "AltStore/1.6.8 (com.rileytestut.AltStore; build:1; iOS 17.4.0)" \
               https://dl.strem.io/apple/altstore/source.json -o source.json

          VERSION=$(jq -r '.apps[0].versions[0].version' source.json)
          echo "VERSION=$VERSION" >> $GITHUB_ENV
          echo "Rilevata versione: $VERSION"

          # 2. Ottieni l'URL del manifesto di versione
          MANIFEST_URL=$(jq -r '.apps[0].versions[0].downloadURL' source.json)
          curl -sSL -A "AltStore/1.6.8 (com.rileytestut.AltStore; build:1; iOS 17.4.0)" "$MANIFEST_URL" -o manifest.json

          # 3. Estrazione sicura dell'URL relativo/assoluto senza Broken Pipe
          RAW_PATH=$(jq -r '.. | strings | select(endswith(".ipa"))' manifest.json 2>/dev/null | { head -n 1; cat >/dev/null; })

          if [[ "$RAW_PATH" == http* ]]; then
            IPA_URL="$RAW_PATH"
          elif [[ "$RAW_PATH" == /* ]]; then
            IPA_URL="https://dl.strem.io$RAW_PATH"
          elif [ -n "$RAW_PATH" ]; then
            IPA_URL="https://dl.strem.io/$RAW_PATH"
          fi

          echo "URL PAL ricostruito: $IPA_URL"

          # 4. Prova il download dall'endpoint PAL
          if [ -n "$IPA_URL" ]; then
            curl -sSL -A "AltStore/1.6.8 (com.rileytestut.AltStore; build:1; iOS 17.4.0)" \
                 -o Stremio.ipa "$IPA_URL"
          fi

          FILESIZE=$(stat -c%s "Stremio.ipa" 2>/dev/null || echo 0)
          echo "Dimensione scaricata da PAL: $FILESIZE byte"

          # 5. FALLBACK AUTOMATICO: Se l'endpoint PAL restituisce il blocco (< 10 MB), scarica l'IPA dalla CDN di distribuzione diretta
          if [ $FILESIZE -lt 10485760 ]; then
            echo "L'endpoint PAL richiede un token Apple. Avvio download diretto dalla CDN di Stremio..."
            
            # URL di distribuzione diretta degli IPA ufficiali
            DIRECT_URL="https://dl.strem.io/apple/stremio-v${VERSION}.ipa"
            
            curl -sSL -A "Mozilla/5.0 (iPhone; CPU iPhone OS 17_4 like Mac OS X)" \
                 -o Stremio.ipa "$DIRECT_URL"
            
            # Se la convenzione del nome differisce, tenta la struttura senza prefisso 'v'
            CHECK_SIZE=$(stat -c%s "Stremio.ipa" 2>/dev/null || echo 0)
            if [ $CHECK_SIZE -lt 10485760 ]; then
              FALLBACK_URL="https://dl.strem.io/apple/stremio-${VERSION}.ipa"
              echo "Tentativo secondo mirror: $FALLBACK_URL"
              curl -sSL -A "Mozilla/5.0 (iPhone; CPU iPhone OS 17_4 like Mac OS X)" \
                   -o Stremio.ipa "$FALLBACK_URL"
            fi
          fi

          # 6. Validazione finale della dimensione del file (> 10 MB)
          FINAL_SIZE=$(stat -c%s "Stremio.ipa" 2>/dev/null || echo 0)
          echo "Dimensione finale file IPA: $FINAL_SIZE byte"

          if [ $FINAL_SIZE -lt 10485760 ]; then
            echo "::error:: Impossibile recuperare un IPA valido. Risposta ottenuta dal server:"
            cat Stremio.ipa | head -n 20
            exit 1
          fi

      - name: Check if Release Already Exists
        id: check_release
        run: |
          if gh release view "v${{ env.VERSION }}" >/dev/null 2>&1; then
            echo "exists=true" >> $GITHUB_OUTPUT
            echo "La release v${{ env.VERSION }} esiste già. Salto la creazione."
          else
            echo "exists=false" >> $GITHUB_OUTPUT
          fi
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Create GitHub Release
        if: steps.check_release.outputs.exists == 'false'
        uses: softprops/action-gh-release@v1
        with:
          tag_name: "v${{ env.VERSION }}"
          name: "Stremio v${{ env.VERSION }}"
          body: |
            Download automatico dell'IPA ufficiale di Stremio.
            
            - **Versione:** ${{ env.VERSION }}
            - **Sorgente:** Stremio Official Distribution
          files: Stremio.ipa
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
