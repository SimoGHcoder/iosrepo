name: Sync Stremio IPA

on:
  schedule:
    - cron: '0 0 * * *' # Esegue la verifica ogni giorno a mezzanotte
  workflow_dispatch: # Permette l'avvio manuale dalla scheda Actions di GitHub

jobs:
  sync-stremio-release:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Download Official Stremio IPA
        id: download_stremio
        run: |
          # 1. Recupera la versione ufficiale dal feed AltStore
          curl -sSL -A "AltStore/1.0" \
               https://dl.strem.io/apple/altstore/source.json -o source.json

          VERSION=$(jq -r '.apps[0].versions[0].version' source.json)
          echo "VERSION=$VERSION" >> $GITHUB_ENV
          echo "Rilevata versione: $VERSION"

          # 2. Ottieni l'URL del manifesto della versione specifica
          MANIFEST_URL=$(jq -r '.apps[0].versions[0].downloadURL' source.json)
          curl -sSL -A "AltStore/1.0" "$MANIFEST_URL" -o manifest.json

          # 3. Estrai l'URL di download fornito da AltStore
          DOWNLOAD_URL=$(jq -r '.downloadURL // .appURL // empty' manifest.json)

          if [ -z "$DOWNLOAD_URL" ]; then
            DOWNLOAD_URL=$(jq -r '.. | strings | select(endswith(".ipa") or endswith(".zip"))' manifest.json | head -n 1)
          fi

          echo "URL individuato: $DOWNLOAD_URL"

          # 4. Scarica il file simulando le intestazioni di AltStore
          curl -sSL \
               -H "User-Agent: AltStore/1.6.8 (com.rileytestut.AltStore; build:1; iOS 17.4.0)" \
               -H "Accept: */*" \
               -o payload_downloaded "$DOWNLOAD_URL"

          # 5. Verifica se è uno ZIP/IPA o un file compresso
          FILE_TYPE=$(file payload_downloaded)
          echo "Tipo file scaricato: $FILE_TYPE"

          if echo "$FILE_TYPE" | grep -iq "Zip archive"; then
            mv payload_downloaded Stremio.ipa
          else
            # Tenta il fallback speculare dai server di rilascio alternativi Stremio
            echo "Tentativo di fallback su endpoint CDN diretto..."
            curl -sSL -A "Mozilla/5.0 (iPhone; CPU iPhone OS 17_4 like Mac OS X)" \
                 -o Stremio.ipa "https://dl.strem.io/apple/altstore/stremio/${VERSION}/Stremio.ipa"
          fi

          # 6. Validazione dimensione finale (> 10 MB)
          FINAL_SIZE=$(stat -c%s "Stremio.ipa" 2>/dev/null || echo 0)
          echo "Dimensione finale: $FINAL_SIZE byte"

          if [ $FINAL_SIZE -lt 10485760 ]; then
            echo "::error:: Il file ottenuto non è un IPA valido ($FINAL_SIZE byte)."
            cat Stremio.ipa | head -n 20
            exit 1
          fi

      - name: Check if Release Already Exists
        id: check_release
        run: |
          if gh release view "v${{ env.VERSION }}" >/dev/null 2>&1; then
            echo "exists=true" >> $GITHUB_OUTPUT
            echo "La release v${{ env.VERSION }} esiste già. Salto la creazione."
          else
            echo "exists=false" >> $GITHUB_OUTPUT
          fi
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Create GitHub Release
        if: steps.check_release.outputs.exists == 'false'
        uses: softprops/action-gh-release@v1
        with:
          tag_name: "v${{ env.VERSION }}"
          name: "Stremio v${{ env.VERSION }}"
          body: |
            Download automatico dell'IPA ufficiale di Stremio (Versione ${{ env.VERSION }}).
            
            - **Versione:** ${{ env.VERSION }}
            - **Sorgente:** Stremio Official Releases
          files: Stremio.ipa
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
