name: Fetch Stremio IPA from AltStore Source

on:
  workflow_dispatch: # Permette l'avvio manuale dalla scheda Actions
  schedule:
    - cron: '0 0 * * 0' # Controllo automatico ogni domenica a mezzanotte

jobs:
  update-stremio:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Fetch IPA URL and Version from Stremio AltStore Source
        id: get_ipa
        run: |
          ALTSTORE_SOURCE_URL="https://dl.strem.io/apple/altstore/source.json"
          
          # Scarica il JSON della sorgente
          SOURCE_JSON=$(curl -sL "$ALTSTORE_SOURCE_URL")
          
          # Estrae l'URL dell'IPA e la versione dall'array delle app
          IPA_URL=$(echo "$SOURCE_JSON" | jq -r '.apps[0].downloadURL')
          VERSION=$(echo "$SOURCE_JSON" | jq -r '.apps[0].version')
          
          if [ -z "$IPA_URL" ] || [ "$IPA_URL" == "null" ]; then
            echo "Errore: Impossibile trovare il downloadURL nel JSON."
            exit 1
          fi
          
          echo "IPA_URL=$IPA_URL" >> $GITHUB_ENV
          echo "VERSION=$VERSION" >> $GITHUB_ENV
          
          # Scarica il file IPA di Stremio
          echo "Download dell'IPA da $IPA_URL..."
          curl -L -o "Stremio.ipa" "$IPA_URL"

      - name: Create Release and Upload IPA
        uses: softprops/action-gh-release@v1
        with:
          tag_name: "stremio-v${{ env.VERSION }}"
          name: "Stremio v${{ env.VERSION }}"
          body: "Scaricamento automatico dell'IPA di Stremio dalla sorgente AltStore ufficiale."
          draft: false
          prerelease: false
          files: |
            Stremio.ipa
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
