name: Sync Stremio IPA

on:
  schedule:
    - cron: '0 0 * * *' # Esegue la verifica ogni giorno a mezzanotte
  workflow_dispatch: # Permette l'avvio manuale dalla scheda Actions di GitHub

jobs:
  sync-stremio-release:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Download Official Stremio IPA
        id: download_stremio
        run: |
          # 1. Recupera la versione corrente dal manifesto sorgente AltStore
          curl -sSL -A "Mozilla/5.0 (iPhone; CPU iPhone OS 17_0 like Mac OS X)" \
               https://dl.strem.io/apple/altstore/source.json -o source.json

          VERSION=$(jq -r '.apps[0].versions[0].version' source.json)
          echo "VERSION=$VERSION" >> $GITHUB_ENV
          echo "Rilevata versione AltStore: $VERSION"

          # 2. Costruisce l'URL diretto usando il pattern statico della CDN Stremio
          DIRECT_IPA_URL="https://dl.strem.io/apple/${VERSION}/ios/stremio_iOS.ipa"
          echo "URL IPA statico: $DIRECT_IPA_URL"

          # 3. Scarica il file .ipa effettivo
          curl -sSL -A "Mozilla/5.0 (iPhone; CPU iPhone OS 17_0 like Mac OS X)" \
               -o Stremio.ipa "$DIRECT_IPA_URL"

          # 4. Verifica che il file sia valido (> 10 MB)
          FILESIZE=$(stat -c%s "Stremio.ipa" 2>/dev/null || echo 0)
          echo "Dimensione file scaricato: $FILESIZE byte"

          if [ $FILESIZE -lt 10485760 ]; then
            echo "::error:: Il file scaricato non è un IPA valido ($FILESIZE byte)."
            cat Stremio.ipa | head -n 20
            exit 1
          fi

      - name: Check if Release Already Exists
        id: check_release
        run: |
          if gh release view "v${{ env.VERSION }}" >/dev/null 2>&1; then
            echo "exists=true" >> $GITHUB_OUTPUT
            echo "La release v${{ env.VERSION }} esiste già. Salto la creazione."
          else
            echo "exists=false" >> $GITHUB_OUTPUT
          fi
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Create GitHub Release
        if: steps.check_release.outputs.exists == 'false'
        uses: softprops/action-gh-release@v1
        with:
          tag_name: "v${{ env.VERSION }}"
          name: "Stremio v${{ env.VERSION }}"
          body: |
            Download automatico dell'IPA ufficiale di Stremio estratto dalla CDN pubblica.
            
            - **Versione:** ${{ env.VERSION }}
            - **Sorgente:** [Stremio CDN Direct](https://dl.strem.io/apple/${{ env.VERSION }}/ios/stremio_iOS.ipa)
          files: Stremio.ipa
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
