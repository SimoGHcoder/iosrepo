name: Sync Stremio IPA

on:
  schedule:
    - cron: '0 0 * * *' # Esegue la verifica ogni giorno a mezzanotte
  workflow_dispatch: # Permette l'avvio manuale dalla scheda Actions di GitHub

jobs:
  sync-stremio-release:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Download Official Stremio IPA
        id: download_stremio
        run: |
          # 1. Scarica il manifesto principale di AltStore
          curl -sSL -A "Mozilla/5.0 (iPhone; CPU iPhone OS 17_0 like Mac OS X)" \
               https://dl.strem.io/apple/altstore/source.json -o source.json

          # 2. Estrae la versione e l'URL del manifesto secondario
          MANIFEST_URL=$(jq -r '.apps[0].versions[0].downloadURL' source.json)
          VERSION=$(jq -r '.apps[0].versions[0].version' source.json)

          echo "VERSION=$VERSION" >> $GITHUB_ENV
          echo "Rilevata versione: $VERSION"
          echo "URL Manifesto: $MANIFEST_URL"

          # 3. Scarica il manifesto della versione
          curl -sSLf -A "Mozilla/5.0 (iPhone; CPU iPhone OS 17_0 like Mac OS X)" \
               "$MANIFEST_URL" -o manifest.json || {
                 echo "::error:: Errore nel download di manifest.json da $MANIFEST_URL"
                 exit 1
               }

          # 4. Estrazione dell'URL IPA:
          # Cerca prima qualsiasi URL che termina espressamente con .ipa
          IPA_URL=$(grep -oE 'https?://[^"]+\.ipa' manifest.json | head -n 1)

          # Fallback: se la stringa non finisce per .ipa, estrae il primo URL HTTPS valido trovato nel manifest
          if [ -z "$IPA_URL" ]; then
            IPA_URL=$(grep -oE 'https?://[^\t\n\r" ]+' manifest.json | head -n 1)
          fi

          echo "URL IPA Reale estratto: $IPA_URL"

          if [ -z "$IPA_URL" ]; then
            echo "::error:: Impossibile trovare un URL valido all'interno di manifest.json"
            exit 1
          fi

          # 5. Scarica il file .ipa effettivo seguendo i reindirizzamenti
          curl -sSL -A "Mozilla/5.0 (iPhone; CPU iPhone OS 17_0 like Mac OS X)" \
               -o Stremio.ipa "$IPA_URL"

          # 6. Verifica che il file sia valido (> 10 MB)
          FILESIZE=$(stat -c%s "Stremio.ipa" 2>/dev/null || echo 0)
          echo "Dimensione file scaricato: $FILESIZE byte"

          if [ $FILESIZE -lt 10485760 ]; then
            echo "::error:: Il file scaricato non è un IPA valido (dimensione: $FILESIZE byte)."
            exit 1
          fi

      - name: Check if Release Already Exists
        id: check_release
        run: |
          # Controlla via GitHub CLI se la release per questa versione esiste già
          if gh release view "v${{ env.VERSION }}" >/dev/null 2>&1; then
            echo "exists=true" >> $GITHUB_OUTPUT
            echo "La release v${{ env.VERSION }} esiste già. Salto la creazione."
          else
            echo "exists=false" >> $GITHUB_OUTPUT
          fi
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Create GitHub Release
        if: steps.check_release.outputs.exists == 'false'
        uses: softprops/action-gh-release@v1
        with:
          tag_name: "v${{ env.VERSION }}"
          name: "Stremio v${{ env.VERSION }}"
          body: |
            Download automatico dell'IPA ufficiale di Stremio estratto dalla sorgente AltStore PAL.
            
            - **Versione:** ${{ env.VERSION }}
            - **Sorgente:** [Stremio Official PAL Source](https://dl.strem.io/apple/altstore/source.json)
          files: Stremio.ipa
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
