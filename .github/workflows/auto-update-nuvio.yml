Name: Nuvio IPA Sync

on:
  schedule:
    # Esegue il controllo automatico ogni giorno a mezzanotte
    - cron: '0 0 * * *'
  workflow_dispatch: # Permette l'avvio manuale dalla scheda Actions di GitHub

permissions:
  contents: write

jobs:
  check-and-update-nuvio:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Install dependencies
        run: |
          pip install requests

      - name: Check latest Nuvio release and upload
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          MY_REPO: ${{ github.repository }}
          OFFICIAL_NUVIO_REPO: "NuvioMedia/NuvioMobile"
        run: |
          python - << 'EOF'
          import os
          import sys
          import requests

          token = os.environ.get('GITHUB_TOKEN')
          my_repo = os.environ.get('MY_REPO')
          official_repo = os.environ.get('OFFICIAL_NUVIO_REPO')

          if not token or not my_repo or not official_repo:
              print("Errore: Variabili d'ambiente mancanti.")
              sys.exit(1)

          headers = {
              'Authorization': f'token {token}',
              'Accept': 'application/vnd.github.v3+json'
          }

          def get_official_release():
              url = f'https://api.github.com/repos/{official_repo}/releases/latest'
              r = requests.get(url, headers=headers, timeout=30)
              if r.status_code != 200:
                  print(f"Errore API GitHub ({official_repo}): Status {r.status_code}")
                  sys.exit(1)
              return r.json()

          def get_my_releases():
              url = f'https://api.github.com/repos/{my_repo}/releases?per_page=100'
              r = requests.get(url, headers=headers, timeout=30)
              if r.status_code == 200:
                  return r.json()
              return []

          # 1. Recupera la release ufficiale
          official_rel = get_official_release()
          latest_tag = official_rel.get('tag_name', '').strip()
          official_body = official_rel.get('body', '')

          ipa_asset = next((a for a in official_rel.get('assets', []) if a['name'].lower().endswith('.ipa')), None)
          if not ipa_asset:
              print("Nessun file .ipa trovato nell'ultima release ufficiale di Nuvio.")
              sys.exit(0)

          ipa_download_url = ipa_asset['browser_download_url']
          clean_tag = latest_tag.lstrip('v')
          dest_ipa_filename = f"nuvio-{clean_tag}.ipa"
          target_tag_name = f"nuvio-v{clean_tag}"

          print(f"Ultima versione ufficiale Nuvio trovata: {latest_tag}")

          # 2. Controlla se la release specifica per questa versione esiste già
          my_releases = get_my_releases()
          existing_release = next((r for r in my_releases if r.get('tag_name') == target_tag_name or r.get('name') == f"Nuvio {latest_tag}"), None)

          if existing_release:
              # Verifica se ha già l'asset IPA allegato
              has_ipa = any(a['name'].lower().endswith('.ipa') for a in existing_release.get('assets', []))
              if has_ipa:
                  print(f"La versione '{latest_tag}' è già presente nelle tue release con un file IPA. Nessun aggiornamento necessario.")
                  sys.exit(0)

          print(f"Nuova versione rilevata ({latest_tag})! Procedo al download...")

          # 3. Download dello streaming del file .ipa
          try:
              with requests.get(ipa_download_url, stream=True, timeout=120) as r_dl:
                  r_dl.raise_for_status()
                  with open(dest_ipa_filename, 'wb') as f:
                      for chunk in r_dl.iter_content(chunk_size=65536):
                          f.write(chunk)
          except Exception as e:
              print(f"Errore durante il download dell'IPA: {e}")
              sys.exit(1)

          try:
              # 4. Creazione / Recupero della Release con Tag Dinamico univoco
              if not existing_release:
                  print(f"Creazione nuova release {target_tag_name}...")
                  create_url = f'https://api.github.com/repos/{my_repo}/releases'
                  payload = {
                      "tag_name": target_tag_name,
                      "name": f"Nuvio {latest_tag}",
                      "body": official_body if official_body else f"Release automatizzata di Nuvio ({latest_tag})",
                      "draft": False,
                      "prerelease": False
                  }
                  r_create = requests.post(create_url, headers=headers, json=payload, timeout=30)
                  if r_create.status_code not in [200, 201]:
                      print(f"Errore creazione release: {r_create.status_code} {r_create.text}")
                      sys.exit(1)
                  target_release = r_create.json()
              else:
                  target_release = existing_release

              release_id = target_release['id']

              # 5. Upload dell'IPA nella Release
              raw_upload_url = target_release.get('upload_url', '')
              if '{' in raw_upload_url:
                  upload_url = raw_upload_url.split('{')[0] + f"?name={dest_ipa_filename}"
              else:
                  upload_url = f"https://uploads.github.com/repos/{my_repo}/releases/{release_id}/assets?name={dest_ipa_filename}"

              headers_upload = headers.copy()
              headers_upload['Content-Type'] = 'application/octet-stream'

              print(f"Caricamento di {dest_ipa_filename} nella release personale...")
              with open(dest_ipa_filename, 'rb') as f:
                  r_upload = requests.post(upload_url, headers=headers_upload, data=f, timeout=300)

              if r_upload.status_code in [200, 201]:
                  print("Upload completato con successo!")
              else:
                  print(f"Errore durante l'upload dell'asset: {r_upload.status_code} {r_upload.text}")
                  sys.exit(1)

          finally:
              if os.path.exists(dest_ipa_filename):
                  os.remove(dest_ipa_filename)
          EOF

      # 6. Scatena l'estrazione delle icone e la rigenerazione di apps.json
      - name: Trigger Full Auto-Extract Workflow
        if: success()
        run: |
          curl -X POST \
            -H "Authorization: token ${{ secrets.GITHUB_TOKEN }}" \
            -H "Accept: application/vnd.github.v3+json" \
            https://api.github.com/repos/${{ github.repository }}/dispatches \
            -d '{"event_type": "ipa_updated"}'
