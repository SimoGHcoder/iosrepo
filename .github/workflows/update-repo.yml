name: Dynamic Auto-Update apps.json

on:
  release:
    types: [published, edited, deleted]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-repository:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Install dependencies
        run: pip install requests

      - name: Rebuild apps.json
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPOSITORY: ${{ github.repository }}
        run: |
          python - << 'EOF'
          import json
          import os
          import requests

          repo = os.environ.get('REPOSITORY')
          token = os.environ.get('GITHUB_TOKEN')
          headers = {'Authorization': f'token {token}'} if token else {}

          # Preset metadati per garantire la compatibilità con SideStore/AltStore
          APP_PRESETS = {
              "nuvio": {
                  "name": "Nuvio",
                  "bundleIdentifier": "com.nuvio.media",
                  "developerName": "Tapframe (NuvioMedia)",
                  "subtitle": "Media player e streaming hub",
                  "localizedDescription": "Nuvio è un media player moderno e completo sviluppato da Tapframe.",
                  "iconURL": f"https://raw.githubusercontent.com/{repo}/main/nuvio.png",
                  "tintColor": "#007AFF"
              },
              "spotify": {
                  "name": "Spotify",
                  "bundleIdentifier": "com.spotify.client",
                  "developerName": "AIMods",
                  "subtitle": "Musica senza pubblicità e skip illimitati",
                  "localizedDescription": "Versione modificata di Spotify curata da AIMods.",
                  "iconURL": f"https://raw.githubusercontent.com/{repo}/main/spotify.png",
                  "tintColor": "#1DB954"
              },
              "calimoto": {
                  "name": "Calimoto",
                  "bundleIdentifier": "com.calimoto.calimoto",
                  "developerName": "Calimoto",
                  "subtitle": "Navigatore GPS per percorsi in moto",
                  "localizedDescription": "Il navigatore GPS ideale per motociclisti.",
                  "iconURL": f"https://raw.githubusercontent.com/{repo}/main/calimoto.png",
                  "tintColor": "#FF5500"
              },
              "shapr3d": {
                  "name": "Shapr3D",
                  "bundleIdentifier": "com.shapr3d.shapr",
                  "developerName": "Shapr3D",
                  "subtitle": "Modellazione 3D CAD per iPad e iOS",
                  "localizedDescription": "Applicazione di modellazione 3D professionale basata sul motore Parasolid.",
                  "iconURL": f"https://raw.githubusercontent.com/{repo}/main/shapr3d.png",
                  "tintColor": "#00D2FF"
              }
          }

          # Struttura base rigenerata completamente da zero
          data = {
              "name": "Sideloading Hub",
              "identifier": "com.simoghcoder.iosrepo",
              "subtitle": "Sideloading Hub: mod, media player e strumenti CAD per LiveContainer",
              "iconURL": f"https://raw.githubusercontent.com/{repo}/main/repoicon.png",
              "apps": [],
              "news": []
          }

          url = f'https://api.github.com/repos/{repo}/releases'
          response = requests.get(url, headers=headers)
          
          if response.status_code != 200:
              print(f"Errore API GitHub: {response.status_code}")
              exit(1)

          releases = response.json()
          apps_dict = {}

          for rel in releases:
              if rel.get('draft'):
                  continue

              tag = rel.get('tag_name', '')
              release_title = rel.get('name', '').strip()
              body = rel.get('body', '')
              published_at = rel.get('published_at', '')

              tag_parts = tag.split('-')
              app_key = tag_parts[0].lower() if len(tag_parts) > 1 else tag.lower()
              version_num = tag_parts[-1].lstrip('v')

              for asset in rel.get('assets', []):
                  if asset['name'].lower().endswith('.ipa'):
                      download_url = asset['browser_download_url']
                      size = asset['size']

                      if app_key not in apps_dict:
                          if app_key in APP_PRESETS:
                              base_app = APP_PRESETS[app_key].copy()
                          else:
                              display_name = release_title if release_title else app_key.capitalize()
                              base_app = {
                                  "name": display_name,
                                  "bundleIdentifier": f"com.simoghcoder.{app_key}",
                                  "developerName": "Sideloading Hub",
                                  "subtitle": f"{display_name} release",
                                  "localizedDescription": body if body else f"Applicazione {display_name}.",
                                  "iconURL": f"https://raw.githubusercontent.com/{repo}/main/repoicon.png",
                                  "tintColor": "#007AFF"
                              }
                          base_app['versions'] = []
                          apps_dict[app_key] = base_app

                      target_app = apps_dict[app_key]

                      version_entry = {
                          "version": version_num,
                          "date": published_at,
                          "downloadURL": download_url,
                          "localizedDescription": body if body else f"Versione {version_num}",
                          "size": size
                      }

                      if not any(v['version'] == version_num for v in target_app['versions']):
                          target_app['versions'].append(version_entry)
                      break

          final_apps = [app for app in apps_dict.values() if len(app.get('versions', [])) > 0]

          for app in final_apps:
              app['versions'].sort(key=lambda x: x['date'], reverse=True)

          data['apps'] = final_apps

          # Sovrascrive completamente apps.json in modo pulito
          with open('apps.json', 'w', encoding='utf-8') as f:
              json.dump(data, f, indent=2, ensure_ascii=False)

          print("File apps.json rigenerato con successo senza errori di parsing!")
          EOF

      - name: Commit and Push
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add apps.json
          git diff --quiet && git diff --staged --quiet || (git commit -m "auto: rigenerato apps.json con sintassi pulita" && git push origin main)
