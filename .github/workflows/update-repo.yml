name: Sideloading Hub Update

on:
  push:
  workflow_dispatch:

jobs:
  update-hub:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install Pillow requests plistlib

      - name: Run update script
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python -c '
          import os
          import zipfile
          import plistlib
          import json
          import struct
          from PIL import Image

          def decode_cgbi(input_path, output_path):
              try:
                  with open(input_path, "rb") as f:
                      data = f.read()

                  if not data.startswith(b"\x89PNG\r\n\x1a\n"):
                      with open(output_path, "wb") as out:
                          out.write(data)
                      return True

                  new_data = bytearray(data[:8])
                  pos = 8
                  has_cgbi = False

                  while pos < len(data):
                      if pos + 8 > len(data):
                          break
                      length = struct.unpack(">I", data[pos:pos+4])[0]
                      chunk_type = data[pos+4:pos+8]
                      chunk_data_start = pos + 8
                      chunk_data_end = chunk_data_start + length
                      chunk_data = data[chunk_data_start:chunk_data_end]
                      pos = chunk_data_end + 4

                      if chunk_type == b"CgBI":
                          has_cgbi = True
                          continue
                      
                      new_data.extend(struct.pack(">I", length) + chunk_type + chunk_data + data[pos-4:pos])

                  with open(output_path, "wb") as out:
                      out.write(new_data)

                  with Image.open(output_path) as img:
                      if has_cgbi and img.mode == "RGBA":
                          r, g, b, a = img.split()
                          img = Image.merge("RGBA", (b, g, r, a))
                      img.save(output_path, "PNG")
                  return True
              except Exception as e:
                  try:
                      im = Image.open(input_path)
                      im.convert("RGBA").save(output_path, "PNG")
                      return True
                  except Exception as inner_e:
                      print(f"Errore conversione icona: {e} / {inner_e}")
                      return False

          print("Script di aggiornamento avviato correttamente.")
          '
