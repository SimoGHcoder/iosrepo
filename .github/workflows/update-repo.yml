name: Full Auto-Extract apps.json from IPA

on:
  release:
    types: [published, edited, deleted]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-repository:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Install dependencies
        run: pip install requests

      - name: Rebuild apps.json from IPA Info.plist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPOSITORY: ${{ github.repository }}
        run: |
          python - << 'EOF'
          import json
          import os
          import re
          import zipfile
          import plistlib
          import requests

          repo = os.environ.get('REPOSITORY')
          token = os.environ.get('GITHUB_TOKEN')
          headers = {'Authorization': f'token {token}'} if token else {}

          # Preset opzionali solo per icone e colori (se non presenti nella repo, usa fallback)
          CUSTOM_METADATA = {
              "com.nuvio.media": {"tintColor": "#007AFF", "iconURL": f"https://raw.githubusercontent.com/{repo}/main/nuvio.png"},
              "com.spotify.client": {"tintColor": "#1DB954", "iconURL": f"https://raw.githubusercontent.com/{repo}/main/spotify.png"},
              "com.calimoto.calimoto": {"tintColor": "#FF5500", "iconURL": f"https://raw.githubusercontent.com/{repo}/main/calimoto.png"},
              "com.shapr3d.shapr": {"tintColor": "#00D2FF", "iconURL": f"https://raw.githubusercontent.com/{repo}/main/shapr3d.png"}
          }

          def extract_ipa_info(ipa_path):
              """Estrae Bundle ID, Versione e Nome dal file Info.plist dentro l'IPA"""
              try:
                  with zipfile.ZipFile(ipa_path, 'r') as ipa:
                      plist_files = [f for f in ipa.namelist() if re.match(r'^Payload/[^/]+\.app/Info\.plist$', f)]
                      if not plist_files:
                          return None
                      with ipa.open(plist_files[0]) as f:
                          plist = plistlib.load(f)
                          bundle_id = plist.get("CFBundleIdentifier")
                          version = plist.get("CFBundleShortVersionString") or plist.get("CFBundleVersion")
                          name = plist.get("CFBundleDisplayName") or plist.get("CFBundleName")
                          return {
                              "bundleIdentifier": bundle_id,
                              "version": version,
                              "name": name
                          }
              except Exception as e:
                  print(f"Errore nella lettura dell'IPA {ipa_path}: {e}")
                  return None

          data = {
              "name": "Sideloading Hub",
              "identifier": "com.simoghcoder.iosrepo",
              "subtitle": "Sideloading Hub: mod, media player e strumenti CAD per LiveContainer",
              "iconURL": f"https://raw.githubusercontent.com/{repo}/main/repoicon.png",
              "apps": [],
              "news": []
          }

          url = f'https://api.github.com/repos/{repo}/releases'
          response = requests.get(url, headers=headers)
          if response.status_code != 200:
              print(f"Errore API GitHub: {response.status_code}")
              exit(1)

          releases = response.json()
          apps_dict = {}

          for rel in releases:
              if rel.get('draft'):
                  continue

              body = rel.get('body', '')
              published_at = rel.get('published_at', '')

              for asset in rel.get('assets', []):
                  if asset['name'].lower().endswith('.ipa'):
                      download_url = asset['browser_download_url']
                      size = asset['size']
                      local_filename = "temp_app.ipa"

                      # Scarica l'IPA per analizzare il file Info.plist interno
                      print(f"Analisi file: {asset['name']}...")
                      r = requests.get(download_url, headers=headers)
                      with open(local_filename, 'wb') as f:
                          f.write(r.content)

                      info = extract_ipa_info(local_filename)
                      if os.path.exists(local_filename):
                          os.remove(local_filename)

                      if not info or not info.get("bundleIdentifier"):
                          print(f"Impossibile estrarre Info.plist da {asset['name']}, salto.")
                          continue

                      bundle_id = info["bundleIdentifier"]
                      version_num = info["version"]
                      app_name = info["name"] or rel.get('name') or "App iOS"

                      if bundle_id not in apps_dict:
                          meta = CUSTOM_METADATA.get(bundle_id, {})
                          apps_dict[bundle_id] = {
                              "name": app_name,
                              "bundleIdentifier": bundle_id,
                              "developerName": "Sideloading Hub",
                              "subtitle": f"{app_name} release",
                              "localizedDescription": body if body else f"Applicazione {app_name}.",
                              "iconURL": meta.get("iconURL", f"https://raw.githubusercontent.com/{repo}/main/repoicon.png"),
                              "tintColor": meta.get("tintColor", "#007AFF"),
                              "versions": []
                          }

                      target_app = apps_dict[bundle_id]
                      version_entry = {
                          "version": version_num,
                          "date": published_at,
                          "downloadURL": download_url,
                          "localizedDescription": body if body else f"Versione {version_num}",
                          "size": size
                      }

                      if not any(v['version'] == version_num for v in target_app['versions']):
                          target_app['versions'].append(version_entry)
                      break

          final_apps = [app for app in apps_dict.values() if len(app.get('versions', [])) > 0]

          for app in final_apps:
              app['versions'].sort(key=lambda x: x['date'], reverse=True)

          data['apps'] = final_apps

          with open('apps.json', 'w', encoding='utf-8') as f:
              json.dump(data, f, indent=2, ensure_ascii=False)

          print("File apps.json generato automaticamente ed estratto direttamente dai pacchetti IPA!")
          EOF

      - name: Commit and Push
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add apps.json
          git diff --quiet && git diff --staged --quiet || (git commit -m "auto: estratto automaticamente Bundle ID e versione dagli IPA" && git push origin main)
