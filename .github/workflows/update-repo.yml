name: Aggiorna Repository AltStore

on:
  schedule:
    - cron: '0 0 * * *' # Esegue l'aggiornamento ogni giorno a mezzanotte
  workflow_dispatch: # Permette l'avvio manuale dalla scheda Actions di GitHub

jobs:
  update-repo:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout del codice
        uses: actions/checkout@v4

      - name: Imposta Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Installa dipendenze
        run: |
          python -m pip install --upgrade pip
          pip install requests Pillow

      - name: Esegui script di generazione metadati e icone
        env:
          REPOSITORY: ${{ github.repository }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python update_repo.py

      - name: Commit e push delle modifiche
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps.json icons/
          git diff --staged --quiet || git commit -m "Aggiornamento automatico catalogo app e icone"
          git push
