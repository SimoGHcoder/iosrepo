name: Full Auto-Extract apps.json & Icons from IPA

on:
  # 1. Scatta su azioni sulle Release
  release:
    types: [published, edited, deleted, released, created]

  # 2. Scatta automaticamente quando finiscono ALTRI workflow che aggiornano gli IPA
  # Sostituisci 'Build IPA' o 'Upload Release' con i nomi esatti dei tuoi altri workflow
  workflow_run:
    workflows: ["Build IPA", "Upload IPA", "Update Release"]
    types:
      - completed

  # 3. Permette il richiamo diretto via API/Webhook da altri workflow o script
  repository_dispatch:
    types: [ipa_updated]

  # 4. Permette l'avvio manuale
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-repository:
    # Se attivato da workflow_run, esegui solo se il workflow precedente ha avuto successo
    if: ${{ github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Install dependencies
        run: |
          pip install requests Pillow pngdefry

      - name: Rebuild apps.json and extract icons
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPOSITORY: ${{ github.repository }}
        run: |
          python - << 'EOF'
          import json
          import os
          import re
          import zipfile
          import plistlib
          import requests
          from PIL import Image
          import pngdefry

          repo = os.environ.get('REPOSITORY')
          token = os.environ.get('GITHUB_TOKEN')
          headers = {'Authorization': f'token {token}', 'Accept': 'application/vnd.github.v3+json'} if token else {}

          os.makedirs('icons', exist_ok=True)
          with open('icons/.gitkeep', 'a') as f:
              pass

          CUSTOM_METADATA = {
              "com.nuvio.media": {"tintColor": "#007AFF"},
              "com.spotify.client": {"tintColor": "#1DB954"},
              "com.calimoto.calimoto": {"tintColor": "#FF5500"},
              "com.shapr3d.shapr": {"tintColor": "#00D2FF"}
          }

          def fix_cgbi_png(raw_path, out_path):
              try:
                  pngdefry.defry(raw_path, out_path)
                  return True
              except Exception:
                  try:
                      with Image.open(raw_path) as img:
                          img.save(out_path, "PNG")
                      return True
                  except Exception as e:
                      print(f"Errore conversione icona {raw_path}: {e}")
                      return False

          def extract_ipa_data(ipa_path, bundle_out_dir):
              try:
                  with zipfile.ZipFile(ipa_path, 'r') as ipa:
                      plist_files = [f for f in ipa.namelist() if re.match(r'^Payload/[^/]+\.app/Info\.plist$', f)]
                      if not plist_files:
                          return None
                      
                      plist_path = plist_files[0]
                      app_folder = os.path.dirname(plist_path)

                      with ipa.open(plist_path) as f:
                          plist = plistlib.load(f)

                      bundle_id = plist.get("CFBundleIdentifier")
                      version = plist.get("CFBundleShortVersionString") or plist.get("CFBundleVersion") or "1.0"
                      name = plist.get("CFBundleDisplayName") or plist.get("CFBundleName")

                      icon_files = []
                      icons_dict = plist.get("CFBundleIcons", {})
                      primary_icon = icons_dict.get("CFBundlePrimaryIcon", {})
                      if "CFBundleIconFiles" in primary_icon:
                          icon_files.extend(primary_icon["CFBundleIconFiles"])
                      elif "CFBundleIconName" in primary_icon:
                          icon_files.append(primary_icon["CFBundleIconName"])
                      
                      if not icon_files and "CFBundleIconFiles" in plist:
                          icon_files.extend(plist["CFBundleIconFiles"])

                      extracted_icon_path = None
                      
                      if icon_files and bundle_id:
                          best_icon = icon_files[-1]
                          for item in ipa.namelist():
                              if item.startswith(app_folder) and best_icon in item and item.endswith('.png'):
                                  icon_filename = f"{bundle_id}.png"
                                  out_file_path = os.path.join(bundle_out_dir, icon_filename)
                                  temp_raw_icon = os.path.join(bundle_out_dir, f"raw_{icon_filename}")
                                  
                                  with ipa.open(item) as icon_file, open(temp_raw_icon, 'wb') as out_file:
                                      out_file.write(icon_file.read())
                                  
                                  if fix_cgbi_png(temp_raw_icon, out_file_path):
                                      extracted_icon_path = f"https://raw.githubusercontent.com/{repo}/main/icons/{icon_filename}"
                                  
                                  if os.path.exists(temp_raw_icon):
                                      os.remove(temp_raw_icon)
                                  break

                      return {
                          "bundleIdentifier": bundle_id,
                          "version": str(version),
                          "name": name,
                          "iconURL": extracted_icon_path
                      }
              except Exception as e:
                  print(f"Errore nella lettura dell'IPA {ipa_path}: {e}")
                  return None

          data = {
              "name": "Sideloading Hub",
              "identifier": "com.simoghcoder.iosrepo",
              "subtitle": "Sideloading Hub: mod, media player e strumenti CAD per LiveContainer",
              "iconURL": f"https://raw.githubusercontent.com/{repo}/main/repoicon.png",
              "apps": [],
              "news": []
          }

          releases = []
          page = 1
          while True:
              url = f'https://api.github.com/repos/{repo}/releases?per_page=100&page={page}'
              response = requests.get(url, headers=headers)
              if response.status_code != 200:
                  print(f"Errore API GitHub: {response.status_code}")
                  break
              page_releases = response.json()
              if not page_releases:
                  break
              releases.extend(page_releases)
              page += 1

          apps_dict = {}

          for rel in releases:
              if rel.get('draft'):
                  continue

              body = rel.get('body', '')
              published_at = rel.get('published_at', '')

              for asset in rel.get('assets', []):
                  if asset['name'].lower().endswith('.ipa'):
                      download_url = asset['browser_download_url']
                      size = asset['size']
                      local_filename = "temp_app.ipa"

                      print(f"Analisi file: {asset['name']}...")
                      r = requests.get(download_url, headers=headers)
                      with open(local_filename, 'wb') as f:
                          f.write(r.content)

                      info = extract_ipa_data(local_filename, 'icons')
                      if os.path.exists(local_filename):
                          os.remove(local_filename)

                      if not info or not info.get("bundleIdentifier"):
                          continue

                      bundle_id = info["bundleIdentifier"]
                      version_num = info["version"]
                      app_name = info["name"] or rel.get('name') or "App iOS"
                      icon_url = info.get("iconURL") or f"https://raw.githubusercontent.com/{repo}/main/repoicon.png"

                      meta = CUSTOM_METADATA.get(bundle_id, {})

                      if bundle_id not in apps_dict:
                          apps_dict[bundle_id] = {
                              "name": app_name,
                              "bundleIdentifier": bundle_id,
                              "developerName": "Sideloading Hub",
                              "subtitle": f"{app_name} release",
                              "localizedDescription": body if body else f"Applicazione {app_name}.",
                              "iconURL": icon_url,
                              "tintColor": meta.get("tintColor", "#007AFF"),
                              "versions": []
                          }

                      target_app = apps_dict[bundle_id]
                      version_entry = {
                          "version": version_num,
                          "date": published_at,
                          "downloadURL": download_url,
                          "localizedDescription": body if body else f"Versione {version_num}",
                          "size": int(size),
                          "bundleIdentifier": bundle_id,
                          "appID": bundle_id
                      }

                      if not any(v['version'] == version_num for v in target_app['versions']):
                          target_app['versions'].append(version_entry)

          final_apps = [app for app in apps_dict.values() if len(app.get('versions', [])) > 0]

          for app in final_apps:
              app['versions'].sort(key=lambda x: x['date'], reverse=True)

          data['apps'] = final_apps

          with open('apps.json', 'w', encoding='utf-8') as f:
              json.dump(data, f, indent=2, ensure_ascii=False)

          print("File apps.json rigenerato con successo!")
          EOF

      - name: Commit and Push
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add apps.json icons/
          git diff --quiet && git diff --staged --quiet || (
            git commit -m "auto: rigenerazione automatica apps.json e icone" &&
            git pull --rebase origin main &&
            git push origin main
          )
