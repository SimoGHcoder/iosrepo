name: iOS Repository Sync & Build

on:
  release:
    types: [published, edited, deleted, released, created]
  workflow_run:
    workflows: ["Nuvio IPA Sync", "Stremio IPA Sync"]
    types: [completed]
  repository_dispatch:
    types: [ipa_updated]
  workflow_dispatch:

concurrency:
  group: auto-extract-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  build-repository:
    if: ${{ github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Build pngdefry locally (esjeon repo)
        run: |
          curl -L https://github.com/esjeon/pngdefry/archive/refs/heads/master.zip -o pngdefry.zip
          unzip -q pngdefry.zip
          cd pngdefry-master
          cc pngdefry.c -o pngdefry
          sudo cp pngdefry /usr/local/bin/
          cd ..
          rm -rf pngdefry-master pngdefry.zip

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Python dependencies
        run: |
          pip install requests Pillow

      - name: Rebuild apps.json and extract icons
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPOSITORY: ${{ github.repository }}
        run: |
          python - << 'EOF'
          import json
          import os
          import re
          import subprocess
          import zipfile
          import plistlib
          import requests
          from PIL import Image

          repo = os.environ.get('REPOSITORY')
          token = os.environ.get('GITHUB_TOKEN')
          api_headers = {'Authorization': f'token {token}', 'Accept': 'application/vnd.github.v3+json'} if token else {}

          os.makedirs('icons', exist_ok=True)
          with open('icons/.gitkeep', 'a') as f:
              pass

          CUSTOM_METADATA = {
              "com.nuvio.media": {"tintColor": "#007AFF", "name": "Nuvio"},
              "com.stremio.stremio": {"tintColor": "#8A52F5", "name": "Stremio"},
              "com.spotify.client": {"tintColor": "#1DB954"},
              "com.calimoto.calimoto": {"tintColor": "#FF5500"},
              "com.shapr3d.shapr": {"tintColor": "#00D2FF"}
          }

          def fetch_appstore_icon(bundle_id, out_file_path):
              try:
                  url = f"https://itunes.apple.com/lookup?bundleId={bundle_id}"
                  resp = requests.get(url, timeout=10)
                  if resp.status_code == 200:
                      data = resp.json()
                      if data.get("resultCount", 0) > 0:
                          result = data["results"][0]
                          artwork_url = result.get("artworkUrl512") or result.get("artworkUrl100")
                          if artwork_url:
                              img_resp = requests.get(artwork_url, timeout=15)
                              if img_resp.status_code == 200:
                                  with open(out_file_path, 'wb') as f:
                                      f.write(img_resp.content)
                                  return True
              except Exception:
                  pass
              return False

          def extract_ipa_data(ipa_path, bundle_out_dir):
              try:
                  with zipfile.ZipFile(ipa_path, 'r') as ipa:
                      plist_files = [f for f in ipa.namelist() if re.match(r'^Payload/[^/]+\.app/Info\.plist$', f)]
                      if not plist_files:
                          return None
                      
                      plist_path = plist_files[0]
                      with ipa.open(plist_path) as f:
                          plist = plistlib.load(f)

                      bundle_id = plist.get("CFBundleIdentifier")
                      version = plist.get("CFBundleShortVersionString") or plist.get("CFBundleVersion") or "1.0"
                      name = plist.get("CFBundleDisplayName") or plist.get("CFBundleName")

                      extracted_icon_path = None
                      
                      if bundle_id:
                          icon_filename = f"{bundle_id}.png"
                          out_file_path = os.path.join(bundle_out_dir, icon_filename)
                          
                          # Recupero automatico dell'icona ufficiale tramite API dello store
                          if fetch_appstore_icon(bundle_id, out_file_path):
                              extracted_icon_path = f"https://raw.githubusercontent.com/{repo}/main/icons/{icon_filename}"
                          else:
                              extracted_icon_path = f"https://raw.githubusercontent.com/{repo}/main/repoicon.png"

                      return {
                          "bundleIdentifier": bundle_id,
                          "version": str(version),
                          "name": name,
                          "iconURL": extracted_icon_path
                      }
              except Exception as e:
                  print(f"Errore nella lettura dell'IPA {ipa_path}: {e}")
                  return None

          data = {
              "name": "Sideloading Hub",
              "identifier": "com.simoghcoder.iosrepo",
              "subtitle": "Sideloading Hub: mod, media player e strumenti CAD per LiveContainer",
              "iconURL": f"https://raw.githubusercontent.com/{repo}/main/repoicon.png",
              "apps": [],
              "news": []
          }

          releases = []
          page = 1
          while True:
              url = f'https://api.github.com/repos/{repo}/releases?per_page=100&page={page}'
              response = requests.get(url, headers=api_headers, timeout=30)
              if response.status_code != 200:
                  print(f"Errore API GitHub: {response.status_code}")
                  break
              page_releases = response.json()
              if not page_releases:
                  break
              releases.extend(page_releases)
              page += 1

          apps_dict = {}

          for rel in releases:
              if rel.get('draft'):
                  continue

              body = rel.get('body', '')
              published_at = rel.get('published_at', '')

              for asset in rel.get('assets', []):
                  if asset['name'].lower().endswith('.ipa'):
                      download_url = asset['browser_download_url']
                      size = asset['size']
                      local_filename = "temp_app.ipa"

                      print(f"Analisi file asset: {asset['name']} (Release: {rel.get('name')})...")
                      
                      try:
                          with requests.get(download_url, stream=True, timeout=120) as r_dl:
                              r_dl.raise_for_status()
                              with open(local_filename, 'wb') as f:
                                  for chunk in r_dl.iter_content(chunk_size=65536):
                                      f.write(chunk)
                      except Exception as e:
                          print(f"Errore durante il download dell'asset {asset['name']}: {e}")
                          continue

                      info = extract_ipa_data(local_filename, 'icons')
                      if os.path.exists(local_filename):
                          os.remove(local_filename)

                      if not info or not info.get("bundleIdentifier"):
                          continue

                      bundle_id = info["bundleIdentifier"]
                      version_num = info["version"]
                      rel_name = rel.get('name', '')
                      
                      match_ver = re.search(r'v?(\d+\.\d+\.\d+(?:-[a-zA-Z0-9\.]+)?)', rel_name)
                      if match_ver:
                          version_num = match_ver.group(1)

                      meta = CUSTOM_METADATA.get(bundle_id, {})
                      app_name = meta.get("name") or info["name"] or rel_name or "App iOS"
                      icon_url = info.get("iconURL") or f"https://raw.githubusercontent.com/{repo}/main/repoicon.png"

                      new_version_entry = {
                          "version": version_num,
                          "date": published_at,
                          "downloadURL": download_url,
                          "localizedDescription": body if body else f"Versione {version_num}",
                          "size": int(size),
                          "bundleIdentifier": bundle_id,
                          "appID": bundle_id
                      }

                      if bundle_id in apps_dict:
                          existing_app = apps_dict[bundle_id]
                          prev_date = existing_app['versions'][0]['date'] if existing_app['versions'] else ""
                          
                          if published_at >= prev_date:
                              existing_app['name'] = app_name
                              if info.get("iconURL") and info.get("iconURL") != f"https://raw.githubusercontent.com/{repo}/main/repoicon.png":
                                  existing_app['iconURL'] = icon_url
                              existing_app['localizedDescription'] = body if body else f"Applicazione {app_name}."
                          
                          if not any(v['version'] == version_num for v in existing_app['versions']):
                              existing_app['versions'].append(new_version_entry)
                      else:
                          apps_dict[bundle_id] = {
                              "name": app_name,
                              "bundleIdentifier": bundle_id,
                              "developerName": repo.split('/')[0] if repo else "Developer",
                              "subtitle": f"{app_name} release",
                              "localizedDescription": body if body else f"Applicazione {app_name}.",
                              "iconURL": icon_url,
                              "tintColor": meta.get("tintColor", "#007AFF"),
                              "versions": [new_version_entry]
                          }

          final_apps = [app for app in apps_dict.values() if len(app.get('versions', [])) > 0]
          data['apps'] = final_apps

          with open('apps.json', 'w', encoding='utf-8') as f:
              json.dump(data, f, indent=2, ensure_ascii=False)

          print("File apps.json rigenerato con successo!")
          EOF

      - name: Commit and Push Changes
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add apps.json icons/
          if ! git diff --staged --quiet; then
            git commit -m "auto: rigenerazione automatica apps.json e icone"
            git pull --rebase origin main
            git push origin main
          else
            echo "Nessun cambiamento rilevato in apps.json o nelle icone."
          fi
