name: Fetch Stremio IPA and Replace Release

on:
  schedule:
    - cron: '0 0 * * *' # Controlla ogni giorno a mezzanotte
  workflow_dispatch: # Permette l'esecuzione manuale dalla scheda Actions

jobs:
  update-stremio:
    runs-on: ubuntu-latest
    permissions:
      contents: write # Necessario per eliminare e creare Release e Tag

    steps:
      - name: Fetch Latest Stremio Metadata
        id: stremio_info
        run: |
          # Scarica il JSON simulando un browser per evitare blocchi User-Agent
          SOURCE_JSON=$(curl -sL -A "Mozilla/5.0 (iPhone; CPU iPhone OS 17_0 like Mac OS X) AppleWebKit/605.1.15" https://dl.strem.io/apple/altstore/source.json)
          
          # Estrae versione e downloadURL cercando nell'array delle app
          VERSION=$(echo "$SOURCE_JSON" | jq -r '(.apps[]? | select(.bundleIdentifier == "com.stremio.stremio" or .name == "Stremio" or .identifier == "com.stremio.stremio")) | .version' | head -n 1)
          RAW_URL=$(echo "$SOURCE_JSON" | jq -r '(.apps[]? | select(.bundleIdentifier == "com.stremio.stremio" or .name == "Stremio" or .identifier == "com.stremio.stremio")) | .downloadURL' | head -n 1)
          
          # Se l'URL estratto è relativo, aggiunge la base del dominio
          if [[ "$RAW_URL" =~ ^http ]]; then
            IPA_URL="$RAW_URL"
          elif [ -n "$RAW_URL" ] && [ "$RAW_URL" != "null" ]; then
            IPA_URL="https://dl.strem.io/apple/altstore/$RAW_URL"
          fi

          # Controllo di sicurezza
          if [ -z "$IPA_URL" ] || [ "$IPA_URL" = "null" ]; then
            echo "::error::Impossibile estrarre l'URL dal JSON. Risposta ricevuta dal server:"
            echo "$SOURCE_JSON" | head -n 20
            exit 1
          fi

          echo "Found Stremio Version: $VERSION"
          echo "Found IPA URL: $IPA_URL"

          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "ipa_url=$IPA_URL" >> $GITHUB_OUTPUT

      - name: Delete Old Release and Tag
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG_NAME="stremio-latest"
          
          # Se la release esiste già, la elimina insieme al vecchio file IPA allegato
          if gh release view "$TAG_NAME" >/dev/null 2>&1; then
            echo "Eliminazione vecchia release e tag $TAG_NAME..."
            gh release delete "$TAG_NAME" --cleanup-tag --yes
          else
            echo "Nessuna release precedente trovata."
          fi

      - name: Download New Stremio IPA
        run: |
          echo "Download Stremio v${{ steps.stremio_info.outputs.version }}..."
          curl -sL -A "Mozilla/5.0 (iPhone; CPU iPhone OS 17_0 like Mac OS X) AppleWebKit/605.1.15" "${{ steps.stremio_info.outputs.ipa_url }}" -o "Stremio.ipa"

      - name: Create New Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG_NAME="stremio-latest"
          
          gh release create "$TAG_NAME" "Stremio.ipa" \
            --title "Stremio v${{ steps.stremio_info.outputs.version }}" \
            --notes "Versione più recente di Stremio (v${{ steps.stremio_info.outputs.version }}). L'IPA precedente è stato rimosso e sostituito."
